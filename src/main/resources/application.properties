# Limites por posição do dataword (índices 0 a 7), separados por vírgula.
# 0, tpatamar, tsubida, vpatamar, vsubida, ohsust, ohgera, 0
dac.dataword.maximums=0,1500,250,8000,250,8000,8000,0
dac.dataword.restrictions=0,1000,250,4000,250,4000,4000,0

