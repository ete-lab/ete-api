# Limites por posição do dataword (índices 0 a 7), separados por vírgula.
# Exemplo com 50% do máximo absoluto (512) e 100% (1023):
# dac.dataword.maximums=512,512,1023,1023,1023,1023,1023,1023
dac.dataword.maximums=1023,1023,1023,1023,1023,1023,1023,1023

